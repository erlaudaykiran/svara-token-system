<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVARA 2026 Token Printing System</title>
<style>
:root{--bg:#f6efe2;--ink:#2a1216;--maroon:#7a1424;--maroon-dark:#590e1a;--gold:#b98a2e;--card:#fffaf0;--line:#dccfb4;--green:#1b5e20;--red:#b00020}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{background:var(--maroon);color:#f7e6b8;padding:16px 20px;text-align:center;position:relative;box-shadow:0 3px 8px rgba(0,0,0,.15)}
header h1{margin:0;font-size:32px;letter-spacing:.32em;font-weight:700;padding-left:.32em}
header p{margin:3px 0 0;font-size:14px;letter-spacing:.05em}
#clock{font-size:13px;opacity:.9;margin-top:5px;font-family:Arial,sans-serif}
.auth-bar{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px;font-family:Arial,sans-serif;font-size:13px;flex-wrap:wrap}
.user-badge{background:rgba(247,230,184,.18);border:1px solid #f7e6b8;border-radius:20px;padding:3px 14px;font-weight:600;letter-spacing:.02em}
.logout-btn{background:transparent;border:1px solid #f7e6b8;color:#f7e6b8;border-radius:4px;padding:4px 12px;cursor:pointer;font-family:Arial,sans-serif;font-size:12px;transition:all .15s}
.logout-btn:hover{background:#f7e6b8;color:var(--maroon)}
main{max-width:920px;margin:0 auto;padding:24px 16px 60px}
h2{font-size:22px;margin:0 0 16px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.choice{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:24px 16px;text-align:center;cursor:pointer;font:inherit;color:inherit;transition:all .18s;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.choice:hover,.choice:focus-visible{border-color:var(--maroon);outline:none;background:#fff3d6;transform:translateY(-2px);box-shadow:0 6px 14px rgba(122,20,36,.12)}
.choice b{display:block;font-size:22px;margin-bottom:4px;color:var(--maroon)}
.choice .card-price{display:inline-block;background:var(--maroon);color:#fff;font-family:Arial,sans-serif;font-size:14px;font-weight:700;padding:3px 12px;border-radius:14px;margin:6px 0 8px}
.choice .choice-serial{font-family:Arial,sans-serif;font-size:12px;color:#7a6858;display:block}
.choice .choice-next{font-family:Arial,sans-serif;font-size:13px;font-weight:700;color:var(--gold);display:block;margin-top:6px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:24px;max-width:500px;margin:0 auto;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.login-panel{max-width:400px;margin:40px auto 0}
label{display:block;font-family:Arial,sans-serif;font-size:14px;font-weight:600;margin:14px 0 5px}
input{width:100%;padding:11px 12px;font-size:17px;border:2px solid var(--line);border-radius:4px;background:#fff;font-family:Arial,sans-serif}
input:focus{outline:none;border-color:var(--maroon)}
.pay{display:flex;gap:10px}
.pay label{flex:1;margin:0;cursor:pointer}
.pay input{position:absolute;opacity:0;width:0;height:0}
.pay span{display:block;text-align:center;padding:11px;font-size:16px;font-weight:700;border:2px solid var(--line);border-radius:4px;background:#fff}
.pay input:checked+span{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.pay input:focus-visible+span{outline:3px solid var(--gold)}
.err{color:var(--red);font-family:Arial,sans-serif;font-size:14px;min-height:20px;margin-top:8px;font-weight:600}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
button.p,button.s{padding:12px 18px;font-size:15px;font-weight:700;border-radius:5px;cursor:pointer;font-family:Arial,sans-serif;border:2px solid var(--maroon);transition:all .15s}
button.p{background:var(--maroon);color:#fff;flex:1}
button.p:hover{background:var(--maroon-dark)}
button.s{background:transparent;color:var(--maroon)}
button.s:hover{background:#fff0d4}
.tag{display:inline-block;background:var(--maroon);color:#f7e6b8;padding:4px 14px;border-radius:4px;font-family:Arial,sans-serif;font-size:14px;font-weight:700;margin-bottom:6px}
.qty-row{display:flex;align-items:center;gap:8px}
.qty-btn{padding:8px 18px!important;font-size:22px!important;font-weight:700!important;line-height:1;border-radius:4px;user-select:none}
.qty-preview{font-family:Arial,sans-serif;font-size:13px;color:var(--maroon);font-weight:700;margin-top:7px;min-height:18px}
.next{font-family:Arial,sans-serif;font-size:13px;color:#6b5a4a;margin-bottom:8px}
.hidden{display:none!important}

/* Tools & admin tabs */
.tools{margin-top:36px;border-top:1px solid var(--line);padding-top:18px}
.counts{font-family:Arial,sans-serif;font-size:14px;margin:0 0 10px;font-weight:600}
.admin-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px;font-family:Arial,sans-serif;font-size:13px}
.summary-card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.summary-card b{display:block;color:var(--maroon);font-size:15px;margin-bottom:2px}
.counter-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab-btn{background:#fff;border:1px solid var(--line);border-radius:4px;padding:6px 14px;cursor:pointer;font-family:Arial,sans-serif;font-size:13px;font-weight:600;color:var(--ink)}
.tab-btn.active{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.tablewrap{overflow-x:auto;margin-top:14px}
table{border-collapse:collapse;width:100%;font-family:Arial,sans-serif;font-size:13px;background:#fff}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;white-space:nowrap}
th{background:#efe3c6;color:var(--maroon);font-weight:700}

/* Actions & Badges */
.action-btn{padding:3px 9px;font-size:12px;border-radius:3px;cursor:pointer;font-family:Arial,sans-serif;font-weight:700;margin-right:4px}
.edit-btn{background:#fff;color:var(--maroon);border:1px solid var(--maroon)}
.edit-btn:hover{background:var(--maroon);color:#fff}
.void-btn{background:#fff;color:var(--red);border:1px solid var(--red)}
.void-btn:hover{background:var(--red);color:#fff}
.badge-active{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:#e8f5e9;color:#1b5e20}
.badge-void{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:#ffebee;color:#b00020}
.row-void{background:#fff5f5!important;opacity:.8}
.strike{text-decoration:line-through;color:#888}

/* Modal dialog */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999}
.modal-card{background:var(--card);border:2px solid var(--maroon);border-radius:8px;padding:24px;width:92%;max-width:440px;box-shadow:0 8px 24px rgba(0,0,0,.25);position:relative}
.modal-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px}
.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--ink);line-height:1}

/* Toast alert */
.toast{position:fixed;bottom:24px;right:24px;background:#1b5e20;color:#fff;padding:12px 20px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.2);font-family:Arial,sans-serif;font-size:14px;font-weight:700;z-index:10000;display:flex;align-items:center;gap:8px;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}

/* Thermal printer print area */
#printArea{display:none}
.token{width:74mm;border:1.5px dashed #000;padding:4mm 3mm 5mm;text-align:center;font-family:Arial,sans-serif;color:#000;margin:0 auto 6mm;page-break-inside:avoid;page-break-after:always;break-after:page}
.token-header{display:flex;align-items:center;justify-content:flex-start;gap:6px;margin-bottom:4px;text-align:left}
.token-logo{width:50px;height:50px;object-fit:contain;flex-shrink:0}
.token-header-text{flex-grow:1;text-align:center}
.token .h{font-size:24px;font-weight:700;letter-spacing:.25em;padding-left:.25em;font-family:Georgia,serif;line-height:1.1;margin:0}
.token .sub{font-size:13px;font-weight:700;margin-top:1px}
.token .contact{font-size:10px;font-weight:700;margin-top:2px;letter-spacing:.01em}
.token .cat{font-size:16px;font-weight:700;margin-top:6px;border-top:1px solid #000;border-bottom:1px solid #000;padding:4px 0}
.token .no{font-size:38px;font-weight:700;margin:5px 0;letter-spacing:.04em}
.token .d{font-size:13px;text-align:left;margin-top:4px;line-height:1.4}
.token .cp{font-size:12px;font-weight:700;margin-top:6px;border-top:1px dashed #444;padding-top:4px}
.cut-spacer{height:10mm}

@media print{
 @page{size:80mm auto;margin:2mm 0}
 body{background:#fff;margin:0;padding:0}
 header,main,#loginSection,#editModal,.toast{display:none!important}
 #printArea{display:block}
 .token{
   width:72mm!important;
   margin:0 auto!important;
   padding:3mm 2mm 5mm!important;
   page-break-inside:avoid!important;
   page-break-after:always!important;
   break-after:page!important;
 }
}
</style>
</head>
<body>
<header>
  <h1>SVARA</h1>
  <p>2026 Lucky Draw &mdash; Token Counter</p>
  <div id="clock"></div>
  <div id="authBar" class="auth-bar hidden">
    <span id="userBadge" class="user-badge"></span>
    <button id="logoutBtn" class="logout-btn">Sign Out</button>
  </div>
</header>

<section id="loginSection" class="hidden">
  <div class="panel login-panel">
    <div class="tag" style="background:var(--maroon);margin-bottom:10px;">Staff &amp; Admin Sign In</div>
    <h2 style="margin-top:0">Sign In</h2>
    <p style="font-family:Arial,sans-serif;font-size:13px;color:#6b5a4a;margin-top:-6px;line-height:1.4">
      Enter your User ID and Password below to access the token system.
    </p>
    <label for="loginUser">User ID</label>
    <input id="loginUser" type="text" autocomplete="username" placeholder="Enter User ID">
    <label for="loginPass">Password</label>
    <input id="loginPass" type="password" autocomplete="current-password" placeholder="Enter Password">
    <div class="err" id="loginErr"></div>
    <div class="row" style="margin-top:16px">
      <button class="p" id="loginBtn">Sign In</button>
    </div>
  </div>
</section>

<main id="appView" class="hidden">
  <section id="stepChoose">
    <h2>Select Lucky Draw Token Type</h2>
    <div class="choices">
      <button class="choice" data-k="RE">
        <b>Royal Enfield</b>
        <div class="card-price">₹301 / token</div>
        <span class="choice-serial">Serial starts at B00001</span>
        <span class="choice-next" id="nx-RE"></span>
      </button>

      <button class="choice" data-k="SI">
        <b>Silver</b>
        <div class="card-price">₹201 / token</div>
        <span class="choice-serial">Serial starts at S00001</span>
        <span class="choice-next" id="nx-SI"></span>
      </button>

      <button class="choice" data-k="SA">
        <b>Saree</b>
        <span class="choice-serial">Serial starts at SA00001</span>
        <span class="choice-next" id="nx-SA"></span>
      </button>
    </div>
  </section>

  <section id="stepForm" class="hidden">
    <div class="panel">
      <div class="tag" id="selTag"></div>
      <div class="next" id="selNext"></div>
      
      <div id="formInputs">
        <label for="name">Customer Name</label>
        <input id="name" type="text" autocomplete="off" maxlength="60" placeholder="Full name">
        
        <label for="mobile">Mobile Number</label>
        <input id="mobile" type="tel" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="10-digit mobile number">
        
        <label for="quantity">Number of Tokens in Serial</label>
        <div class="qty-row">
          <button type="button" class="s qty-btn" id="qtyMinus">-</button>
          <input id="quantity" type="number" min="1" max="100" value="1" inputmode="numeric" style="text-align:center;font-weight:700">
          <button type="button" class="s qty-btn" id="qtyPlus">+</button>
        </div>
        <div class="qty-preview" id="qtyPreview"></div>

        <label>Payment Method</label>
        <div class="pay">
          <label><input type="radio" name="pay" value="Cash"><span>Cash</span></label>
          <label><input type="radio" name="pay" value="UPI"><span>UPI</span></label>
        </div>
      </div>

      <div class="err" id="err"></div>

      <!-- Single Action: Automatically Saves & Prints -->
      <div class="row" id="formActionRow">
        <button type="button" class="p" id="issueBtn">🖨️ Print &amp; Issue Token</button>
        <button type="button" class="s" id="backBtn">Back</button>
      </div>
    </div>
  </section>

  <section class="tools">
    <div id="adminSummaryWrap" class="hidden">
      <div class="admin-summary" id="adminSummary"></div>
      <div class="counter-tabs" id="counterTabs">
        <button class="tab-btn active" data-counter="all">All Counters (Combined)</button>
        <button class="tab-btn" data-counter="counter1">Counter 1</button>
        <button class="tab-btn" data-counter="counter2">Counter 2</button>
        <button class="tab-btn" data-counter="counter3">Counter 3</button>
        <button class="tab-btn" data-counter="admin">Admin / Main</button>
      </div>
    </div>

    <p class="counts" id="counts"></p>
    
    <div class="row">
      <button class="s" id="xlsBtn">Download Excel</button>
      <button class="s" id="backupDbBtn" style="color:var(--green);border-color:var(--green);font-weight:700">💾 Backup Database (.db)</button>
      <button class="s" id="viewBtn">View Records</button>
      <button class="s hidden" id="adminVoidBtn" style="color:var(--red);border-color:var(--red)">🚫 Void Token</button>
      <button class="s hidden" id="adminEditBtn" style="color:var(--maroon);border-color:var(--maroon)">✏️ Edit Token</button>
      <button class="s hidden" id="importBtn" style="color:var(--green);border-color:var(--green)">📥 Restore Backup (.xlsx / .db)</button>
      <input type="file" id="importFileInput" accept=".xlsx,.db,.sqlite,.sqlite3" style="display:none">
    </div>

    <div id="storageNotice" style="font-family:Arial,sans-serif;font-size:12px;color:#6b5a4a;margin-top:10px"></div>
    <div class="tablewrap hidden" id="tableWrap"></div>
  </section>
</main>

<!-- Admin Edit Modal Dialog -->
<div id="editModal" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="modal-header">
      <h3 style="margin:0;font-size:18px;color:var(--maroon)">✏️ Edit Token Details</h3>
      <button type="button" class="modal-close" id="editModalClose">&times;</button>
    </div>
    <div style="font-family:Arial,sans-serif;font-size:13px;color:#6b5a4a;margin:10px 0 14px">
      Editing details for Token: <b id="editModalSerial" style="color:var(--maroon);font-size:16px"></b>
    </div>
    <label for="editName">Customer Name</label>
    <input id="editName" type="text" autocomplete="off" maxlength="60">
    <label for="editMobile">Mobile Number</label>
    <input id="editMobile" type="tel" inputmode="numeric" maxlength="10" autocomplete="off">
    <label>Payment Method</label>
    <div class="pay">
      <label><input type="radio" name="editPay" value="Cash" id="editPayCash"><span>Cash</span></label>
      <label><input type="radio" name="editPay" value="UPI" id="editPayUPI"><span>UPI</span></label>
    </div>
    <div class="err" id="editErr"></div>
    <div class="row" style="margin-top:16px">
      <button type="button" class="p" id="editSaveBtn">Save Changes</button>
      <button type="button" class="s" id="editCancelBtn">Cancel</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<div id="printArea"></div>

<script>
var TYPES = { RE: 'Royal Enfield', SI: 'Silver', SA: 'Saree' };
var PRICES = { RE: 301, SI: 201, SA: 0 };
var PREFIXES = { RE: 'B', SI: 'S', SA: 'SA' };

var currentUser = null;
var current = null;
var counters = {};
var activeCounterFilter = 'all';
var busy = false;
var activeEditSerial = null;
var toastTimer = null;

// Preload the logo image into browser cache
var logoImg = new Image();
logoImg.src = '/logo.jpg';

function showToast(msg){
  var el = document.getElementById('toast');
  el.innerHTML = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 4000);
}

function esc(s){
  return String(s || '').replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

function two(n){ return String(n).padStart(2, '0'); }

function stamp(d){
  var h = d.getHours(), ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return {
    date: two(d.getDate()) + '/' + two(d.getMonth() + 1) + '/' + d.getFullYear(),
    time: two(h) + ':' + two(d.getMinutes()) + ':' + two(d.getSeconds()) + ' ' + ap
  };
}

function tick(){
  var s = stamp(new Date());
  document.getElementById('clock').textContent = s.date + '  |  ' + s.time;
}
setInterval(tick, 1000);
tick();

function showLogin(msg){
  document.getElementById('loginSection').classList.remove('hidden');
  document.getElementById('appView').classList.add('hidden');
  document.getElementById('authBar').classList.add('hidden');
  document.getElementById('loginPass').value = '';
  document.getElementById('loginErr').textContent = msg || '';
  setTimeout(function(){ document.getElementById('loginUser').focus(); }, 100);
}

function showApp(user){
  currentUser = user;
  document.getElementById('loginSection').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  document.getElementById('authBar').classList.remove('hidden');

  var roleIcon = user.role === 'admin' ? '👑 Administrator (All Counters)' : '👤 ' + (user.name || user.username);
  document.getElementById('userBadge').textContent = roleIcon;

  if(user.role === 'admin'){
    document.getElementById('adminSummaryWrap').classList.remove('hidden');
    document.getElementById('adminVoidBtn').classList.remove('hidden');
    document.getElementById('adminEditBtn').classList.remove('hidden');
    document.getElementById('importBtn').classList.remove('hidden');
  } else {
    document.getElementById('adminSummaryWrap').classList.add('hidden');
    document.getElementById('adminVoidBtn').classList.add('hidden');
    document.getElementById('adminEditBtn').classList.add('hidden');
    document.getElementById('importBtn').classList.add('hidden');
  }
  refresh();
}

function checkAuth(){
  fetch('/api/auth/status')
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(j.authenticated){
        showApp({ username: j.username, role: j.role, name: j.name, counter_name: j.counter_name });
      } else {
        showLogin();
      }
    })
    .catch(function(){
      showLogin('Cannot reach the server.');
    });
}

function doLogin(){
  var u = document.getElementById('loginUser').value.trim();
  var p = document.getElementById('loginPass').value.trim();
  var err = document.getElementById('loginErr');
  var btn = document.getElementById('loginBtn');
  if(!u || !p){
    err.textContent = 'Please enter both User ID and Password.';
    return;
  }
  err.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Signing in...';

  fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: u, password: p })
  })
  .then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if(!r.ok) throw new Error(j.error || 'Invalid credentials');
      return j;
    });
  })
  .then(function(res){
    showApp({ username: res.username, role: res.role, name: res.name, counter_name: res.counter_name });
  })
  .catch(function(e){
    err.textContent = e.message;
  })
  .then(function(){
    btn.disabled = false;
    btn.textContent = 'Sign In';
  });
}

document.getElementById('loginBtn').onclick = doLogin;
document.getElementById('loginPass').onkeydown = function(e){ if(e.key === 'Enter') doLogin(); };
document.getElementById('loginUser').onkeydown = function(e){ if(e.key === 'Enter') doLogin(); };

document.getElementById('logoutBtn').onclick = function(){
  fetch('/api/auth/logout', { method: 'POST' })
    .then(function(){ showLogin('Signed out successfully.'); })
    .catch(function(){ showLogin(); });
};

function api(path, opts){
  return fetch(path, opts).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if(r.status === 401){
        showLogin(j.error || 'Session expired. Please sign in again.');
        throw new Error(j.error || 'Authentication required');
      }
      if(!r.ok) throw new Error(j.error || ('Server error (' + r.status + ')'));
      return j;
    });
  }, function(){
    throw new Error('Cannot connect to the server. Check your network connection.');
  });
}

function fmtSerial(prefix, n){
  return prefix + String(n).padStart(5, '0');
}

function refresh(){
  return api('/api/counters').then(function(res){
    counters = res.categories || {};
    var cats = counters;
    var totActive = 0;
    var totVoid = 0;
    Object.keys(TYPES).forEach(function(k){
      if(cats[k]){
        document.getElementById('nx-' + k).textContent = 'Next: ' + cats[k].next;
        totActive += (cats[k].issued || 0);
        totVoid += (cats[k].voided || 0);
      }
    });

    if(res.currentUser && res.currentUser.role === 'admin' && res.counterBreakdown){
      var b = res.counterBreakdown;
      var sumHtml = '';
      var totalRev = 0;
      var tabsHtml = '<button class="tab-btn ' + (activeCounterFilter === 'all' ? 'active' : '') + '" data-counter="all">All Counters (Combined)</button>';
      Object.keys(b).forEach(function(uk){
        sumHtml += '<div class="summary-card"><b>' + esc(b[uk].name) + '</b>' + b[uk].count + ' active' + (b[uk].void_count ? ' (' + b[uk].void_count + ' void)' : '') + ' &bull; ₹' + b[uk].amount.toLocaleString('en-IN') + '</div>';
        totalRev += b[uk].amount;
        var isAct = (activeCounterFilter === uk) ? 'active' : '';
        tabsHtml += '<button class="tab-btn ' + isAct + '" data-counter="' + esc(uk) + '">' + esc(b[uk].name) + '</button>';
      });
      document.getElementById('adminSummary').innerHTML = sumHtml;
      document.getElementById('counterTabs').innerHTML = tabsHtml;
      document.querySelectorAll('#counterTabs .tab-btn').forEach(function(btn){
        btn.onclick = function(){
          document.querySelectorAll('#counterTabs .tab-btn').forEach(function(x){ x.classList.remove('active'); });
          btn.classList.add('active');
          activeCounterFilter = btn.dataset.counter || 'all';
          renderTable();
        };
      });
      document.getElementById('counts').innerHTML = '<b>Combined Total:</b> ' + totActive + ' active tokens' + (totVoid ? ' (' + totVoid + ' voided)' : '') + ' &bull; Total Collection: <b>₹' + totalRev.toLocaleString('en-IN') + '</b>';
    } else {
      var myStats = res.myStats || { count: 0, amount: 0 };
      document.getElementById('counts').innerHTML = '<b>' + esc(currentUser.name || currentUser.username) + ':</b> ' + myStats.count + ' active tokens issued &bull; Collection: <b>₹' + myStats.amount.toLocaleString('en-IN') + '</b>';
    }

    if(!document.getElementById('tableWrap').classList.contains('hidden')){
      renderTable();
    }
  }).catch(function(e){
    document.getElementById('counts').textContent = e.message;
  });
}

function updateQtyPreview(){
  if(!current || !counters[current]) return;
  var qEl = document.getElementById('quantity');
  var q = parseInt(qEl.value, 10);
  if(isNaN(q) || q < 1) q = 1;
  if(q > 100) q = 100;
  var pfx = PREFIXES[current];
  var nextStr = counters[current].next || '';
  var match = nextStr.match(/\d+$/);
  var startNo = match ? parseInt(match[0], 10) : 1;
  var endNo = startNo + q - 1;
  var startSerial = fmtSerial(pfx, startNo);
  var endSerial = fmtSerial(pfx, endNo);
  var unitPrice = PRICES[current] || 0;
  var totalPrice = unitPrice * q;

  var prevEl = document.getElementById('qtyPreview');
  var btnEl = document.getElementById('issueBtn');
  if(unitPrice > 0){
    if(q === 1){
      prevEl.textContent = 'Next Token: ' + startSerial + '  |  Total: ₹' + totalPrice;
      btnEl.textContent = '🖨️ Print & Issue Token (₹' + totalPrice + ')';
    } else {
      prevEl.textContent = 'Next Tokens: ' + startSerial + ' to ' + endSerial + ' (' + q + ' tokens)  |  Total: ₹' + totalPrice + ' (' + q + ' × ₹' + unitPrice + ')';
      btnEl.textContent = '🖨️ Print & Issue ' + q + ' Tokens (₹' + totalPrice + ')';
    }
  } else {
    if(q === 1){
      prevEl.textContent = 'Next Token: ' + startSerial;
      btnEl.textContent = '🖨️ Print & Issue Token';
    } else {
      prevEl.textContent = 'Next Tokens: ' + startSerial + ' to ' + endSerial + ' (' + q + ' tokens)';
      btnEl.textContent = '🖨️ Print & Issue ' + q + ' Tokens';
    }
  }
}

document.querySelectorAll('.choice').forEach(function(b){
  b.onclick = function(){
    current = b.dataset.k;
    var price = PRICES[current] || 0;
    document.getElementById('selTag').textContent = price > 0 ? (TYPES[current] + ' — ₹' + price + ' per token') : TYPES[current];
    document.getElementById('selNext').textContent = counters[current] ? 'Next serial begins at ' + counters[current].next : '';
    document.getElementById('quantity').value = '1';
    updateQtyPreview();
    document.getElementById('stepChoose').classList.add('hidden');
    document.getElementById('stepForm').classList.remove('hidden');
    document.getElementById('err').textContent = '';
    document.getElementById('name').focus();
  };
});

function toChoose(){
  document.getElementById('stepForm').classList.add('hidden');
  document.getElementById('stepChoose').classList.remove('hidden');
  document.getElementById('name').value = '';
  document.getElementById('mobile').value = '';
  document.getElementById('quantity').value = '1';
  document.querySelectorAll('input[name="pay"]').forEach(function(p){ p.checked = false; });
  current = null;
  refresh();
}

document.getElementById('backBtn').onclick = toChoose;
document.getElementById('mobile').oninput = function(){ this.value = this.value.replace(/\D/g, ''); };

document.getElementById('qtyMinus').onclick = function(){
  var el = document.getElementById('quantity');
  var v = (parseInt(el.value, 10) || 1) - 1;
  if(v < 1) v = 1;
  el.value = v;
  updateQtyPreview();
};

document.getElementById('qtyPlus').onclick = function(){
  var el = document.getElementById('quantity');
  var v = (parseInt(el.value, 10) || 1) + 1;
  if(v > 100) v = 100;
  el.value = v;
  updateQtyPreview();
};
document.getElementById('quantity').oninput = updateQtyPreview;

function tokenHTML(t, copy){
  var hasPrice = (t.price && Number(t.price) > 0);
  var priceHeader = hasPrice ? (' &mdash; ₹' + t.price) : '';
  var priceDetail = hasPrice ? ('<b>Price: ₹' + t.price + '</b><br>') : '';
  return '<div class="token">' +
    '<div class="token-header">' +
      '<img src="/logo.jpg" class="token-logo" alt="Logo">' +
      '<div class="token-header-text">' +
        '<div class="h">SVARA</div>' +
        '<div class="sub">2026 Lucky Draw</div>' +
        '<div class="contact">Cell: +91 9848433020, +91 9885897093</div>' +
      '</div>' +
    '</div>' +
    '<div class="cat">' + esc(t.type) + priceHeader + '</div>' +
    '<div class="no">' + esc(t.serial) + '</div>' +
    '<div class="d">' +
      priceDetail +
      'Name: ' + esc(t.name) + '<br>' +
      'Mobile: ' + esc(t.mobile) + '<br>' +
      'Payment: ' + esc(t.payment) + '<br>' +
      'Counter: ' + esc(t.counter_name || 'Counter') + '<br>' +
      'Date: ' + t.date + '<br>' +
      'Time: ' + t.time +
    '</div>' +
    '<div class="cp">' + copy + '</div>' +
    '<div class="cut-spacer"></div>' +
  '</div>';
}

/* =========================================================
   AUTOMATIC SAVE & PRINT (ONE CLICK)
   Saves atomically to DB & Excel, then prints official slips.
   ========================================================= */

document.getElementById('issueBtn').onclick = function(){
  if(busy) return;
  var name = document.getElementById('name').value.trim();
  var mobile = document.getElementById('mobile').value.trim();
  var qty = parseInt(document.getElementById('quantity').value, 10) || 1;
  var err = document.getElementById('err');
  var payEl = document.querySelector('input[name="pay"]:checked');

  if(!name){ err.textContent = 'Please enter customer name.'; return; }
  if(!/^\d{10}$/.test(mobile)){ err.textContent = 'Please enter a valid 10-digit mobile number.'; return; }
  if(qty < 1 || qty > 100){ err.textContent = 'Please enter a quantity between 1 and 100.'; return; }
  if(!payEl){ err.textContent = 'Please select a payment method: Cash or UPI.'; return; }
  err.textContent = '';

  busy = true;
  var btn = this;
  btn.disabled = true;
  btn.textContent = '⏳ Saving & Generating Token...';

  api('/api/tokens', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      type: current,
      name: name,
      mobile: mobile,
      payment: payEl.value,
      quantity: qty
    })
  })
  .then(function(res){
    var tokensList = res.tokens || [res];

    // Build slips for thermal printer
    var printHtml = '';
    tokensList.forEach(function(t){
      printHtml += tokenHTML(t, 'Customer copy') + tokenHTML(t, 'Office copy');
    });
    document.getElementById('printArea').innerHTML = printHtml;

    var serText = tokensList.length === 1 ? tokensList[0].serial : (tokensList[0].serial + ' to ' + tokensList[tokensList.length - 1].serial);
    var revToast = (res.total_amount && res.total_amount > 0) ? (' &bull; ₹' + res.total_amount) : '';
    showToast('✅ Saved & Issued: ' + serText + ' (' + esc(tokensList[0].name) + ')' + revToast);

    toChoose();
    setTimeout(function(){ window.print(); }, 120);
  })
  .catch(function(e){
    err.textContent = 'Error: ' + e.message;
  })
  .then(function(){
    busy = false;
    btn.disabled = false;
    updateQtyPreview();
  });
};

/* =========================================================
   RECORDS TABLE & ROLE-BASED ACCESS
   Admin: has full Edit and Void controls
   Counters: read-only records without Edit/Void buttons
   ========================================================= */

function renderTable(){
  var url = '/api/tokens';
  if(currentUser.role === 'admin' && activeCounterFilter && activeCounterFilter !== 'all'){
    url += '?counter=' + encodeURIComponent(activeCounterFilter);
  }

  api(url).then(function(r){
    var wrap = document.getElementById('tableWrap');
    if(!r || !r.length){
      wrap.innerHTML = '<p class="counts">No records found' + (activeCounterFilter !== 'all' ? ' for ' + activeCounterFilter : '') + '.</p>';
      return;
    }

    var isAdmin = (currentUser.role === 'admin');

    var h = '<table><tr>' +
      '<th>Serial</th>' +
      '<th>Type</th>' +
      '<th>Price</th>' +
      '<th>Status</th>' +
      '<th>Name</th>' +
      '<th>Mobile</th>' +
      '<th>Payment</th>' +
      (isAdmin ? '<th>Counter</th>' : '') +
      '<th>Date</th>' +
      '<th>Time</th>' +
      (isAdmin ? '<th>Action</th>' : '') +
      '</tr>';

    r.forEach(function(x){
      var isVoid = (x.status === 'VOID');
      var rowClass = isVoid ? ' class="row-void"' : '';
      var serialDisplay = isVoid ? '<span class="strike"><b>' + esc(x.serial) + '</b></span>' : '<b>' + esc(x.serial) + '</b>';
      var statusBadge = isVoid ? '<span class="badge-void">VOID</span>' : '<span class="badge-active">ACTIVE</span>';

      var priceBadge = (x.price && Number(x.price) > 0) ? ('<b>₹' + esc(x.price) + '</b>') : '-';
      h += '<tr' + rowClass + '>' +
        '<td>' + serialDisplay + '</td>' +
        '<td>' + esc(x.type) + '</td>' +
        '<td>' + priceBadge + '</td>' +
        '<td>' + statusBadge + '</td>' +
        '<td id="cell-name-' + esc(x.serial) + '">' + esc(x.name) + '</td>' +
        '<td id="cell-mobile-' + esc(x.serial) + '">' + esc(x.mobile) + '</td>' +
        '<td id="cell-pay-' + esc(x.serial) + '">' + esc(x.payment) + '</td>' +
        (isAdmin ? '<td>' + esc(x.counter_name || x.created_by) + '</td>' : '') +
        '<td>' + esc(x.date) + '</td>' +
        '<td>' + esc(x.time) + '</td>';

      if(isAdmin){
        h += '<td>';
        if(isVoid){
          h += '<span style="color:#b00020;font-size:12px;font-weight:700">VOIDED</span>';
        } else {
          h += '<button class="action-btn edit-btn" onclick="openEditModal(\'' + esc(x.serial) + '\',\'' + esc(x.name) + '\',\'' + esc(x.mobile) + '\',\'' + esc(x.payment) + '\')">✏️ Edit</button>' +
               '<button class="action-btn void-btn" onclick="voidToken(\'' + esc(x.serial) + '\',\'' + esc(x.name) + '\')">🚫 Void</button>';
        }
        h += '</td>';
      }

      h += '</tr>';
    });

    wrap.innerHTML = h + '</table>';
  }).catch(function(e){
    document.getElementById('tableWrap').innerHTML = '<p class="counts">' + esc(e.message) + '</p>';
  });
}

/* =========================================================
   ADMIN EDIT MODAL
   ========================================================= */

function openEditModal(serial, name, mobile, pay){
  activeEditSerial = serial;
  document.getElementById('editModalSerial').textContent = serial;
  document.getElementById('editName').value = name || '';
  document.getElementById('editMobile').value = mobile || '';
  document.getElementById('editErr').textContent = '';

  if(pay === 'UPI'){
    document.getElementById('editPayUPI').checked = true;
  } else {
    document.getElementById('editPayCash').checked = true;
  }

  document.getElementById('editModal').classList.remove('hidden');
  document.getElementById('editName').focus();
}

function closeEditModal(){
  document.getElementById('editModal').classList.add('hidden');
  activeEditSerial = null;
}

document.getElementById('editModalClose').onclick = closeEditModal;
document.getElementById('editCancelBtn').onclick = closeEditModal;

document.getElementById('editSaveBtn').onclick = function(){
  if(!activeEditSerial) return;
  var name = document.getElementById('editName').value.trim();
  var mobile = document.getElementById('editMobile').value.trim();
  var payEl = document.querySelector('input[name="editPay"]:checked');
  var err = document.getElementById('editErr');

  if(!name){ err.textContent = 'Please enter customer name.'; return; }
  if(!/^\d{10}$/.test(mobile)){ err.textContent = 'Please enter a valid 10-digit mobile number.'; return; }
  if(!payEl){ err.textContent = 'Please select payment method.'; return; }
  err.textContent = '';

  var btn = this;
  btn.disabled = true;
  btn.textContent = 'Saving...';

  api('/api/tokens/' + encodeURIComponent(activeEditSerial), {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name, mobile: mobile, payment: payEl.value })
  })
  .then(function(res){
    showToast('✅ Token ' + activeEditSerial + ' updated successfully!');
    closeEditModal();
    renderTable();
  })
  .catch(function(e){
    err.textContent = e.message;
  })
  .then(function(){
    btn.disabled = false;
    btn.textContent = 'Save Changes';
  });
};

/* =========================================================
   ADMIN VOID LOGIC (STRICTLY NON-ROLLING)
   ========================================================= */

function voidToken(serial, name){
  var msg = '⚠️ Are you sure you want to VOID Token ' + serial;
  if(name) msg += ' (' + name + ')';
  msg += '?\n\n• The token will be marked VOID and excluded from collection revenue.\n• The next serial numbers will strictly CONTINUE FORWARD and will NOT roll back.';

  if(!confirm(msg)) return;

  api('/api/tokens/' + encodeURIComponent(serial) + '/void', { method: 'POST' })
    .then(function(res){
      showToast('🚫 Token ' + serial + ' has been marked VOID.');
      refresh();
    })
    .catch(function(e){
      alert('Error: ' + e.message);
    });
}

// Admin Toolbar Buttons
document.getElementById('adminVoidBtn').onclick = function(){
  var s = prompt('Enter Token Serial to VOID (e.g. B00001, S00005, SA00002):');
  if(!s || !s.trim()) return;
  voidToken(s.trim().toUpperCase());
};

document.getElementById('adminEditBtn').onclick = function(){
  var s = prompt('Enter Token Serial to Edit (e.g. B00001, S00005, SA00002):');
  if(!s || !s.trim()) return;
  s = s.trim().toUpperCase();
  api('/api/tokens').then(function(tokens){
    var match = tokens.find(function(t){ return t.serial.toUpperCase() === s; });
    if(!match){
      alert('Token ' + s + ' was not found.');
      return;
    }
    if(match.status === 'VOID'){
      alert('Token ' + s + ' is VOID and cannot be edited.');
      return;
    }
    openEditModal(match.serial, match.name, match.mobile, match.payment);
  });
};

document.getElementById('viewBtn').onclick = function(){
  var w = document.getElementById('tableWrap');
  w.classList.toggle('hidden');
  this.textContent = w.classList.contains('hidden') ? 'View Records' : 'Hide Records';
  if(!w.classList.contains('hidden')) renderTable();
};

document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.onclick = function(){
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    activeCounterFilter = btn.dataset.counter || 'all';
    renderTable();
  };
});

document.getElementById('xlsBtn').onclick = function(){
  var url = '/api/export';
  if(currentUser && currentUser.role === 'admin' && activeCounterFilter && activeCounterFilter !== 'all'){
    url += '?counter=' + encodeURIComponent(activeCounterFilter);
  }
  window.location.href = url;
};

document.getElementById('backupDbBtn').onclick = function(){
  window.location.href = '/api/backup/db';
};

document.getElementById('importBtn').onclick = function(){
  document.getElementById('importFileInput').click();
};

document.getElementById('importFileInput').onchange = function(){
  var file = this.files[0];
  if(!file) return;
  var formData = new FormData();
  formData.append('file', file);
  var btn = document.getElementById('importBtn');
  btn.disabled = true;
  btn.textContent = 'Restoring...';
  fetch('/api/import', {
    method: 'POST',
    body: formData
  })
  .then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if(!r.ok) throw new Error(j.error || 'Import failed');
      return j;
    });
  })
  .then(function(res){
    alert(res.message || 'Restored successfully!');
    refresh();
  })
  .catch(function(e){
    alert('Import error: ' + e.message);
  })
  .then(function(){
    btn.disabled = false;
    btn.textContent = '📥 Restore Backup (.xlsx / .db)';
    document.getElementById('importFileInput').value = '';
  });
};

function checkStorageStatus(){
  fetch('/api/system/status')
    .then(function(r){ return r.json(); })
    .then(function(j){
      var el = document.getElementById('storageNotice');
      if(el){
        if(j.persistent){
          el.innerHTML = '<span style="color:var(--green);font-weight:700">&#x25CF; Storage: ' + esc(j.storage) + '</span>';
        } else {
          el.innerHTML = '<span style="color:var(--red);font-weight:700">&#x25CF; Storage: Temporary Container Disk</span> &mdash; Click <b>Backup Database (.db)</b> to save a permanent copy to your laptop anytime.';
        }
      }
    })
    .catch(function(){});
}

checkAuth();
checkStorageStatus();
