services:
  - type: web
    name: svara-token-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SVARA_USER
        value: admin
      - key: SVARA_PASSWORD
        value: svara@2026
